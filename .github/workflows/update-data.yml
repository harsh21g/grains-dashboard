name: Update data
 
on:
  schedule:
    # Every weekday at 22:00 UTC (6 pm US Eastern in summer, 5 pm in winter).
    # This is after the weekly USDA, CFTC and EIA releases.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:   # lets you press "Run workflow" yourself
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install
        run: pip install -r requirements.txt
 
      - name: Download data
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/run_all.py
 
      - name: Save new data
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Update data" && git push)
